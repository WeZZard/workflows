name: Propose Release

on:
  workflow_call:
    inputs:
      version_file:
        required: true
        type: string
      release_branch_prefix:
        required: false
        type: string
        default: release
    secrets:
      RELEASE_TOKEN:
        required: true
      OPENCODE_AUTH_JSON:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: WeZZard/workflows
          ref: v1.0.1
          path: wezzard-workflows
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path

      - name: Configure OpenCode auth
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/opencode"
          if [ -n "${OPENCODE_AUTH_JSON:-}" ]; then
            echo "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
            chmod 600 "$HOME/.local/share/opencode/auth.json"
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Suggest next version
        id: suggest
        run: |
          set -euo pipefail
          RESULT=$(node wezzard-workflows/scripts/suggest-version.mjs \
            --version-file "${{ inputs.version_file }}")
          echo "$RESULT"
          CURRENT=$(echo "$RESULT" | jq -r '.current')
          NEXT=$(echo "$RESULT" | jq -r '.next')
          BUMP=$(echo "$RESULT" | jq -r '.bump')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump version file
        run: |
          set -euo pipefail
          FILE="${{ inputs.version_file }}"
          NEXT="${{ steps.suggest.outputs.next }}"
          TMP=$(mktemp)
          jq --arg v "$NEXT" '.version = $v' "$FILE" > "$TMP"
          mv "$TMP" "$FILE"

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          NEXT="${{ steps.suggest.outputs.next }}"
          BUMP="${{ steps.suggest.outputs.bump }}"
          BRANCH="${{ inputs.release_branch_prefix }}/${NEXT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "${{ inputs.version_file }}"
          git commit -m "release: bump to ${NEXT} (${BUMP})"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "release: v${NEXT}" \
            --body "$(cat <<EOF
          Proposed **${BUMP}** release bump (${{ steps.suggest.outputs.current }} → ${NEXT}).

          Merge to trigger tag + catalog sync via \`release.yml\`.
          EOF
          )"
