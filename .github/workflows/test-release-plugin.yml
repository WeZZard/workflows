name: Test Release Tooling

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".pi/**"
      - "bin/**"
      - "skills/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate workflow YAML syntax
        run: node scripts/validate-workflows.mjs

      - name: Test local release tool
        run: npm test

      - name: Verify Git package contents
        run: npm run pack:check
